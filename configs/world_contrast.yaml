_comment: 'Prediction 1 from VALENCE.md: does a SIGNED, graded write stop the constant collapse? Identical
  to configs/world.yaml except on_wrong: contrast. Every move is written - positively when it beat the
  sampled alternatives, negatively when it lost to them - and when a sampled alternative beat it, that
  alternative is also written positively (contrastive, never the enumerated optimum). Chunk weights are
  normalised to sum|w|=1 so the effective learning rate matches the unsigned run and a difference cannot
  be an LR artifact. Baseline to beat is results/world: REFUSE x48 on all three dispositions, 0.44/0.15/0.52
  against floors of 0.50/0.70/0.58. Success is MORE THAN ONE distinct move and holding above CONSTANT_FLOOR
  - read the action distribution, not the accuracy.'
