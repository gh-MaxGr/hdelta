seed: 1
model:
  name: Qwen/Qwen2.5-3B-Instruct
  dtype: bfloat16
  device: cuda
plastic:
  max_fraction: 0.05
  postsynaptic: error
  update_norm: adam
  decay_enabled: true
  homeo_enabled: true
  updates_enabled: true
  groups:
    hdeltaH:
      patterns:
      - model.layers.{L}.self_attn.q_proj
      - model.layers.{L}.self_attn.k_proj
      - model.layers.{L}.self_attn.v_proj
      - model.layers.{L}.self_attn.o_proj
      layers:
      - -1
      - -2
      - -3
      - -4
      - -5
      - -6
      - -7
      - -8
      - -9
      eta: 0.0001
      decay: 0.004
      budget: 0.03
      homeo_mode: global
rem:
  enabled: true
  every: 200
  steps: 8
  batch: 8
  seq_len: 32
  eta: 0.25
  postsynaptic: delta
  threshold: 0.0
  probe_around: false
task:
  name: logic
  tagged: false
  rules:
    composition:
      family: composition
      seed: 11
stream:
  phases:
  - rule: composition
    puzzles: 600
  batch_size: 4
  n_shots: 2
  rule_text: true
  self_generate: true
  verifier_mode: honest
  verifier_fpr: 0.0
  on_wrong: teach
  consolidate: verified
  exposure: both
  consolidation_repeats: 1
  probe_every: 25
  probe_n: 64
  probe_depth: false
  seen_window: 48
  shots_cover_exception: false
monitor:
  enabled: true
  every: 2
  threshold: 0.15
  deliberate_frozen: true
  rollback: false
  confidence: true
  save_delta: false
  checkpoint_spectra: true
  checkpoint_rolling: 0
eval:
  lm_reference: data/lm_reference.txt
  cloze: data/cloze.json
  lm_windows: 24
  compile_threshold: 0.8
_comment: Composition, seed 1, instrumented for the weight-space cliff. Seed 0 ran
  1.00 for ten probes then fell to 1.00->0.14 at the last probe while fw_norm moved
  only 0.0049->0.0057. NOT norm accumulation (lowest norm in the set) and NOT REM
  (the probe precedes the sleep). FIRST question is whether it reproduces at all -
  runs are not bit-reproducible and self-training amplifies divergence, so the cliff
  may be a one-off. Probing every 25 puzzles tightens the bracket; spectra are logged
  at every probe so a singular-value spike or a top-direction sign flip is visible
  without storing 340 MB per checkpoint.
