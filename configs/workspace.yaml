# Generalising tool-call cache: distilling a build-graph query into the fast weights.
# Plastic slice follows the validated recipe (attention only, top 9 layers).
seed: 0

model:
  name: Qwen/Qwen2.5-3B-Instruct
  dtype: bfloat16
  device: cuda

plastic:
  max_fraction: 0.05
  postsynaptic: error
  update_norm: adam
  decay_enabled: true
  homeo_enabled: true
  updates_enabled: true
  groups:
    hdeltaH:                           # attention projections ONLY - adding the MLP
      patterns:                        # costs a skill and triples perplexity drift
        - "model.layers.{L}.self_attn.q_proj"
        - "model.layers.{L}.self_attn.k_proj"
        - "model.layers.{L}.self_attn.v_proj"
        - "model.layers.{L}.self_attn.o_proj"
      layers: [-1, -2, -3, -4, -5, -6, -7, -8, -9]
      eta: 0.0001
      decay: 0.004
      budget: 0.03
      homeo_mode: global

rem:
  enabled: true
  every: 100
  steps: 8
  batch: 8
  seq_len: 32
  eta: 0.25
  postsynaptic: delta
  threshold: 0.0

task:
  name: workspace
  n_packages: 6
  n_overrides: 2
  depth: [1, 2]
  latency_ms: 750             # cost of one real build-graph query
  sleep: false                # account the latency; only sleep for an end-to-end demo
  tagged: false               # flip to true (with tag_map) when interleaving workspaces
  rules:                      # each rule is one workspace layout = one skill
    # Same area across rules: when these are interleaved the path must NOT reveal
    # which workspace applies, or the tag carries no load and the cues stop competing.
    A: {seed: 11, area: libs}
    B: {seed: 22, area: libs}
    C: {seed: 33, area: libs}
    D: {seed: 44, area: libs}

stream:
  phases:
    - {rule: A, puzzles: 400}
    - {rule: B, puzzles: 400}
    - {rule: A, puzzles: 200}
  batch_size: 4
  n_shots: 2
  exposure: both
  consolidation_repeats: 1
  probe_every: 20
  probe_n: 48
  seen_window: 48

eval:
  lm_reference: data/lm_reference.txt
  cloze: data/cloze.json
  lm_windows: 24
  compile_threshold: 0.8
