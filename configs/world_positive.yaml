_comment: 'ABLATION arm: graded reward, NO punishment. Third rung of a ladder whose other two already
  exist. skip (results/world) writes every verified item with the same eta; this writes only items with
  positive advantage, weighted by it; contrast (configs/world_contrast.yaml) writes everything, signed,
  plus a contrastive alternative. If THIS alone prevents the REFUSE x48 collapse, the missing ingredient
  was gradation and punishment is unnecessary - which is the cheaper and more surprising result.'
