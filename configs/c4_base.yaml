# Connect-Four VALUE on a 5x4 board: the first task a reason cache cannot solve.
# Tool as teacher: every stream position is labelled by the exact solver and written straight
# into the fast weights (exposure: direct). There is no deliberate LLM path here - a 3B model
# cannot search a game tree in its head - so the "slow path" at deployment is the solver itself.
# The plastic recipe is the conjunction baseline (attention, last 9 layers, eta 1e-4).
# Probes are HELD-OUT positions: disjoint from the stream by construction (hash of the
# mirror-canonical board), so every probe accuracy is generalisation.
seed: 0
model:
  name: Qwen/Qwen2.5-3B-Instruct
  dtype: bfloat16
  device: cuda
plastic:
  max_fraction: 0.05
  postsynaptic: error
  update_norm: adam
  decay_enabled: true
  homeo_enabled: true
  updates_enabled: true
  groups:
    hdeltaH:
      patterns:
        - model.layers.{L}.self_attn.q_proj
        - model.layers.{L}.self_attn.k_proj
        - model.layers.{L}.self_attn.v_proj
        - model.layers.{L}.self_attn.o_proj
      layers: [-1, -2, -3, -4, -5, -6, -7, -8, -9]
      eta: 0.0001
      decay: 0.004
      budget: 0.03
      homeo_mode: global
rem:
  enabled: true
  every: 200
  steps: 8
  batch: 8
  seq_len: 32
  eta: 0.25
  postsynaptic: delta
  threshold: 0.0
  probe_around: false
task:
  name: connect4
  width: 5
  height: 4
  plies: [4, 14]
  heldout_mod: 4
  rules:
    c4: {}
stream:
  phases:
    - rule: c4
      puzzles: 4000
  batch_size: 4
  n_shots: 0
  rule_text: false
  self_generate: false
  probe_minimal: true
  free_probe: false
  exposure: direct
  consolidate: all
  consolidation_repeats: 1
  verifier_mode: honest
  verifier_fpr: 0.0
  on_wrong: teach
  probe_every: 250
  probe_n: 256
  probe_depth: false
  seen_window: 64
monitor:
  enabled: false
  confidence: true
  save_delta: true
eval:
  lm_reference: data/lm_reference.txt
  cloze: data/cloze.json
  lm_windows: 24
  compile_threshold: 0.8
_comment: "c4 baseline recipe, seed 0, 4000 positions"
