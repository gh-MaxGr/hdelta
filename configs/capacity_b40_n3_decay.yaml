seed: 0
model:
  name: Qwen/Qwen2.5-3B-Instruct
  dtype: bfloat16
  device: cuda
plastic:
  max_fraction: 0.05
  postsynaptic: error
  update_norm: adam
  decay_enabled: true
  homeo_enabled: true
  updates_enabled: true
  groups:
    hdeltaH:
      patterns:
      - model.layers.{L}.self_attn.q_proj
      - model.layers.{L}.self_attn.k_proj
      - model.layers.{L}.self_attn.v_proj
      - model.layers.{L}.self_attn.o_proj
      layers:
      - -1
      - -2
      - -3
      eta: 0.0001
      decay: 0.002
      budget: 0.06
      homeo_mode: global
    hdeltaG:
      patterns:
      - model.layers.{L}.mlp.down_proj
      layers:
      - -1
      - -2
      - -3
      eta: 0.0001
      decay: 0.002
      budget: 0.06
      homeo_mode: global
rem:
  enabled: true
  every: 100
  steps: 8
  batch: 8
  seq_len: 32
  eta: 0.25
  postsynaptic: delta
  threshold: 0.0
  probe_around: false
task:
  name: cipher
  alphabet: digits
  alphabet_size: 10
  length:
  - 3
  - 3
  tagged: true
  rules:
    A7:
    - - shift
      - 4
    - - shift
      - 3
    M6:
    - - shift
      - 3
    - - mirror
    A3:
    - - shift
      - 1
    - - shift
      - 2
stream:
  phases:
  - rule: A7
    puzzles: 40
  - rule: M6
    puzzles: 40
  - rule: A3
    puzzles: 40
