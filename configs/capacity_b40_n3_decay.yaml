    puzzles: 40
  - rule: A7
    puzzles: 40
  - rule: M6
    puzzles: 40
  - rule: A3
    puzzles: 40
  - rule: A7
    puzzles: 40
  - rule: M6
    puzzles: 40
  - rule: A3
    puzzles: 40
  - rule: A7
