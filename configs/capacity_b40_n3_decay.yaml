  - rule: A7
    puzzles: 40
  - rule: M6
    puzzles: 40
  - rule: A3
    puzzles: 40
  batch_size: 4
  n_shots: 4
  exposure: both
  consolidation_repeats: 1
  probe_every: 40
  probe_n: 32
  seen_window: 48
  rule_text: true
  self_generate: true
  on_wrong: teach
  consolidate: verified
  free_probe: false
  gen_max_new: 40
  probe_depth: false
eval:
  lm_reference: data/lm_reference.txt
  cloze: data/cloze.json
  lm_windows: 12
  compile_threshold: 0.8
_comment: 'Part C confound test: capacity_b40_n3 re-run with decay 0.004 -> 0.002
  and budget 0.03 -> 0.06. Part D showed raising the equilibrium via decay costs +0.90%
  perplexity where raising eta cost +18%, and lifted a stalled 4-rule run. If these
  rungs lift, Part C measured an ENERGY limit, not a slice-size ceiling.'
