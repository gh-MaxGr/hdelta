# Instructed, self-generated slow path on Qwen2.5-3B-Instruct (bf16 frozen weights, fp32 fast
# weights), digit cipher.  Override on top of base.yaml:
#   python run_experiment.py --config configs/base.yaml --override configs/instructed_3b.yaml --out results/suite3b/full
model:
  name: Qwen/Qwen2.5-3B-Instruct
  dtype: bfloat16
plastic:
  groups:
    hdeltaH:
      eta: 0.0001
      budget: 0.03
    hdeltaG:
      eta: 0.0001
      budget: 0.03
task:
  name: cipher
  alphabet: digits
  alphabet_size: 10
  length: [3, 3]
  rules:
    A: [["shift", 3], ["mirror"]]      # add 3, then 9 - d  -> compiles to d -> 6 - d
    B: [["shift", 4], ["shift", 3]]    # add 4, then add 3  -> compiles to d -> d + 7
stream:
  rule_text: true          # state the rule on the slow path and in instructed probes
  self_generate: true      # the model generates its own steps + answer (excitation path)
  on_wrong: teach          # wrong self-generated answers get the correct demonstration
  consolidate: verified    # only verified answers are replayed zero-shot into the h-delta groups
  free_probe: true         # open-ended probe: does it still think, how many tokens?
  gen_max_new: 40
  n_shots: 4
  probe_every: 40
  probe_n: 48
eval:
  lm_windows: 12
