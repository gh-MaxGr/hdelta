_comment: 'Three DISPOSITIONS, not three situations: the same offer has different right answers for a
  trader, a diplomat and a hardliner, and they disagree on 43% of situations. The engine scores OUTCOMES
  - it applies a move and evaluates the resulting world - so unlike every earlier task here the verifier
  does not contain the answer. on_wrong: skip, so only moves the model found itself and the engine verified
  are written. Read results against world.CONSTANT_FLOOR (trader 0.46, diplomat 0.70, hardliner 0.58),
  never against random: a disposition scoring at or below its best constant policy has collapsed. Enumerated
  reference is 1.00.'
