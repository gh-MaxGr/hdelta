  batch_size: 4
  n_shots: 2
  rule_text: true
  self_generate: true
  verifier_mode: honest
  verifier_fpr: 0.0
  on_wrong: teach
  consolidate: verified
  exposure: both
  consolidation_repeats: 1
  gen_max_new: 220
  probe_every: 50
  probe_n: 48
  probe_depth: false
  free_probe: false
  seen_window: 48
monitor:
  enabled: true
  every: 2
  threshold: 0.15
  deliberate_frozen: true
  rollback: false
  confidence: false
  save_delta: true
  max_new_deliberate: 256
eval:
  lm_reference: data/lm_reference.txt
  cloze: data/cloze.json
  lm_windows: 24
  compile_threshold: 0.8
_comment: Three real conventions from this repo's CLAUDE.md (the coding assistant's instruction file), each written down because
  the model could not produce it cold. rule_text states the convention on the slow path; the compiled
  path gets the bare task with an EMPTY context. Stream and probes draw from DISJOINT halves of the input
  pools (see repoidiom._pools), so held-out accuracy cannot be satisfied by recalling a trained string
  - v1 had 14 markers and 18 scripts against 360 stream puzzles per rule and measured a cached dictionary.
  monitor.max_new_deliberate=256 because the default 64 truncates the reference on two of three rules,
  which read as deliberate=0.00 and is an apparatus artefact, not a finding. 3 rules is inside the ~6-skill
  capacity limit; attention locus because these are associative mappings, ~0.46% ppl against MLP's ~3.06%.
